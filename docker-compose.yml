services:
  club_monitor:
    build: .
    container_name: club_monitor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Интервал опроса в секундах. Можно переопределить в .env
      CLUB_INTERVAL: "${CLUB_INTERVAL:-60}"
    volumes:
      # Список клубов с ключами - монтируется, а не встраивается в образ
      # (образ можно пересобирать/публиковать без секретов внутри)
      - ./clubs.json:/app/clubs.json:ro
      # База данных сохраняется на хосте в ./data и переживает
      # пересборку/перезапуск контейнера
      - ./data:/app/data
